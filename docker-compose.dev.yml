name: modaodfweb
services:
  redhat-pkg:
    container_name: modaodfweb-rhpkg
    hostname: modaodfweb-rhpkg
    image: rockylinux:8
    volumes:
      - type: bind
        source: ./
        target: /project
    environment:
      - http_proxy
      - https_proxy
      - HTTP_PROXY
      - HTTPS_PROXY

      # Set this environment variable to your local timezone settings
      # for proper operation timestamp
      #- TZ=CST-8
    init: true
    command: sleep infinity

  redhat-test:
    container_name: modaodfweb-rhtest
    hostname: modaodfweb-rhtest
    image: rockylinux:8
    volumes:
      - type: bind
        source: ./
        target: /project
    environment:
      - http_proxy
      - https_proxy
      - HTTP_PROXY
      - HTTPS_PROXY

      # Set this environment variable to your local timezone settings
      # for proper operation timestamp
      #- TZ=CST-8
    init: true
    command: sleep infinity
    ports:
      - '9980:9980'
